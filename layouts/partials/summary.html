<div class="resume-intro py-3">
    <div class="media flex-column flex-md-row align-items-center">
        {{ with .Site.Params.profile.avatar }}
        <img class="resume-profile-image mb-3 mb-md-0 mr-md-5 ml-md-0 rounded mx-auto" src="{{ printf "assets/images/%s" (strings.TrimPrefix "/" .) | relURL }}" alt="{{ $.Site.Params.profile.name }}">
        {{ end }}
        <div class="media-body text-left">
            {{ .Site.Params.summary.text | markdownify }}
        </div>
    </div>
</div>
