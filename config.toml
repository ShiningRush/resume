    [params.summary]
        enable = true
        text = """
字节跳动 AI 平台与基础设施负责人，0→1 组建并管理 **30+ 人团队**，负责视觉大模型平台与全球基础设施建设。支撑抖音、TikTok、剪映、豆包等业务的能力交付，推动核心业务自助交付与 AIGC 平台商业化。

平台稳定承载峰值 **16 万+ QPS**，管理 **26 万+ GPU**，持续提升资源效率、核心服务可用性与成本竞争力。曾主导腾讯游戏容器平台建设，现为 **Apache APISIX PMC 成员**。
"""

    [params.experience]
        enable = true

        [[params.experience.list]]
        title = "AI 平台与基础设施负责人"
        dates = "2021—至今"
        company = "字节跳动 ByteDance"
        details = "担任智能创作 AI 平台基建部门负责人，0→1 组建并管理 **30+ 人团队**，培养 **4 位技术方向负责人**。负责视觉模型后训练、工程化交付、全球基础设施与资源运营体系，支撑内部业务规模化交付及外部平台商业化。"

        [[params.experience.list.items]]
        title = "平台交付"
        details = "主导建设 ByteArtist，将工程与算法逐项陪跑的交付模式升级为业务自助。基于工作流依赖与运行环境的导出、恢复，打通后训练、调试、自动工程化、压测与部署，实现 **10 分钟完成工程化及部署，1 小时内完成自动化测试**，月均交付 **100+ AI 能力**，覆盖图片、视频及 VLM 模型，支撑抖音、TikTok、剪映、豆包及 Seed 系列能力交付。"
        [[params.experience.list.items]]
        title = "全球基础设施"
        details = "自研资源与流量调度、模型分发加速、多地域同步及多活架构，支撑业务从图片模型扩展至视频及 VLM 模型，峰值 QPS 从 **1 万增长至 16 万+**，GPU 规模从 **6,000 张增长至 26 万+ 张**。"
        [[params.experience.list.items]]
        title = "运营体系"
        details = """
从 0→1 建立部门资源与成本运营体系，涵盖 SOP、运营数仓与经营平台，打通资源预算收集、提报、日历预占与交付流程，实现视觉能力流量与资源分布的度量和观测，保障重点活动零资源阻塞。
牵头成本优化专项，支撑 2024 年剪映「放大镜」、2025 年抖音「庖丁」与 2026 年 TikTok「利用率治理」专项，2024—2026 年业务平均万次调用成本从 **442 元降至 55 元**，累计节省成本 **超过 4 亿元**。
"""
        [[params.experience.list.items]]
        title = "GPU 资源效率"
        details = "建立服务画像、上线准入、存量分层治理及定期复盘机制，按流量、启动时延和 GPU 计算空泡制定优化策略。结合镜像瘦身与分层、模型分发加速、在线混部、智能扩缩容及负载均衡，将推理 GPU 日均 SMA 从 **10%+ 提升至 40%+**，部分能力 **超过 70%**。"
        [[params.experience.list.items]]
        title = "稳定性治理"
        details = "基于统一交付底座建立技术标准、SLA 治理及可观测体系，将核心服务可用性从 **96%+ 提升至 99.97%+**。牵头多机房容灾改造，支撑国内外容灾演练；以 **零事故**保障 2026 年豆包春晚视觉业务流量。"
        [[params.experience.list.items]]
        title = "AIGC 生态与商业化"
        details = "自研兼容 ComfyUI 的编排引擎，建设 Lumi、Lumina 共用的技术底座，支撑两平台商业化交付；两平台 2026 年全球营收合计 **近 1 亿元**。沉淀 **10 万+ 工作流、插件与模型资产**，支撑创作与特效交付。Lumi 于 2025 年上线，面向国内企业提供后训练、编排调试与部署；Lumina 面向海外内容创作，支持画布式创作与创作 Agent，同时通过 AI 开放平台以 OpenAPI 对外提供视觉能力。"

