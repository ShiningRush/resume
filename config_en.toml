    [params.summary]
        enable = true
        text = """
Currently AI Platform Infrastructure Lead at ByteDance Intelligent Creation. Built an AI middle platform as the foundation to meet global infrastructure needs across the lifecycle of vision foundation model delivery—covering model training, resource management, capability development & debugging, deployment, multi-region synchronization, traffic scheduling, resource delivery, and reliability—providing unified engineering and scaling capabilities for both internal and external scenarios.
- Platform & Delivery (AI Middle Platform): Internally, “ByteArtist” supports capability delivery for Douyin, TikTok, CapCut, and Doubao; externally, “Lumi” is offered as a ToB service on Volcano Engine. The platform covers training/debugging/engineering/deployment/operations/experience, delivering 100+ AI capabilities monthly (including the Seed series). Core teams can self-serve delivery with zero manual engineering intervention.
- Infrastructure & Scale: Supports peak 100k+ QPS, >200k GPUs, and global multi-region active-active. Through image slimming/layering, online colocation, model distribution acceleration, intelligent autoscaling, and load balancing, average inference GPU utilization improved from 10% to 40% (with some capabilities >70%).
- Reliability & Cost: Established unified BC-side governance (observability/disaster recovery/runbooks), improving availability from 1 nine to 3–4 nines. Built pricing and auto-estimation systems; completed RMB 100M+ cost rationalization in 2024, enabling fine-grained resource and budget management.

Previously led the container platform in Tencent Games, driving multi-business cloud-native transition. Open-source: Apache APISIX PMC Member with long-term contributions.
"""

